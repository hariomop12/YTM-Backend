version: "3.9"

services:
  api:
    build: .
    container_name: soundwave-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - soundwave-net

  mysql:
    image: mysql:8.0
    container_name: soundwave-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - soundwave-net

  redis:
    image: redis:7-alpine
    container_name: soundwave-redis
    ports:
      - "6379:6379"
    networks:
      - soundwave-net

volumes:
  mysql_data:

networks:
  soundwave-net:
    driver: bridge